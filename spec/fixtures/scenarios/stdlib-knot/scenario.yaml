---
# The stdlib major-bump knot: pupgrade's spec fixture, as data.
#
# Old releases depend on stdlib < 9 and new ones on stdlib >= 9. The deployed
# state holds every conflict kind; Puppetfile.proposed bumps stdlib and a few
# modules with it, introducing many conflicts and resolving a few. Built by
# spec/support/scenario_builder.rb; see the format notes there. Keys that
# start with `.` only hold anchors.

.shared:
  operatingsystems:
    os_el_old: &os_el_old { RedHat: ['7', '8'], CentOS: ['7'], Ubuntu: ['18.04', '20.04'], Debian: ['10', '11'] }
    os_el: &os_el { RedHat: ['8', '9'], Rocky: ['8', '9'], Ubuntu: ['20.04', '22.04'], Debian: ['11', '12'] }
    os_deb: &os_deb { Ubuntu: ['20.04', '22.04'], Debian: ['11', '12'] }
    os_rh: &os_rh { RedHat: ['7', '8', '9'], CentOS: ['7'], OracleLinux: ['7', '8', '9'] }
    os_foss: &os_foss { Rocky: ['8', '9'], AlmaLinux: ['8', '9'], CentOS: ['7'] }
  ranges:
    stdlib_old: &stdlib_old '>= 4.13.1 < 9.0.0'
    stdlib_new: &stdlib_new '>= 9.0.0 < 10.0.0'
    puppet_old: &puppet_old '>= 6.0.0 < 8.0.0'
    puppet_mid: &puppet_mid '>= 7.0.0 < 9.0.0'
    puppet_new: &puppet_new '>= 8.0.0 < 9.0.0'

forge: 'https://forge.example.com'

# What a release declares when it does not say.
release_defaults:
  puppet: *puppet_mid
  operatingsystems: *os_el_old

# In build order: commit dates count up across the whole build, so the
# order is part of every sha.
modules:
  - name: puppetlabs-stdlib
    deployed: '8.6.0'
    releases:
      - version: '8.6.0'
      - version: '9.0.0'
        operatingsystems: *os_el
        remove:
          - lib/puppet/parser/functions/legacy_shout.rb
      - version: '9.4.0'
        operatingsystems: *os_el
      - version: '9.6.0'
        operatingsystems: *os_el
  - name: puppetlabs-concat
    deployed: '7.3.0'
    releases:
      - version: '7.3.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_old
      - version: '9.0.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_el
      - version: '9.1.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_el
  - name: puppetlabs-apt
    deployed: '8.5.0'
    releases:
      - version: '8.5.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_old
        operatingsystems: *os_deb
      - version: '9.0.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_deb
      - version: '9.4.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_deb
  - name: puppetlabs-inifile
    deployed: '5.4.0'
    releases:
      - version: '5.4.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_old
      - version: '6.0.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_el
      - version: '6.1.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
        operatingsystems: *os_el
  - name: puppetlabs-apache
    deployed: '10.1.1'
    unreleased: true
    releases:
      - version: '10.1.1'
        dependencies:
          puppetlabs/stdlib: *stdlib_old
          puppetlabs/concat: '>= 6.4.0 < 8.0.0'
      - version: '11.0.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
          puppetlabs/concat: *stdlib_new
        operatingsystems: *os_el
      - version: '12.0.0'
        dependencies:
          puppetlabs/stdlib: *stdlib_new
          puppetlabs/concat: *stdlib_new
        puppet: *puppet_new
        operatingsystems: *os_el
  - name: puppetlabs-postgresql
    deployed: '8.3.0'
