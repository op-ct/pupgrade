# Puppetfile overlays written beside the deployed Puppetfile: the file name,
# then the version each listed module moves to. Unlisted modules stay put.
proposals:
  Puppetfile.proposed:
    puppetlabs-stdlib: '9.6.0'
    puppetlabs-concat: '9.1.0'
    puppetlabs-apt: '9.4.0'
